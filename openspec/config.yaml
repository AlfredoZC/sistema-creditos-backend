schema: spec-driven

context: |
  Tech stack: NestJS 10 (Express platform), TypeScript 5.1, TypeORM 0.3 + PostgreSQL
  Architecture: feature modules (auth, profile, seed, cloudinary, common) with module/controller/service, entities/, dto/ (class-validator + barrel index.ts), guards/strategies/decorators in auth, Swagger at /api
  Testing: Jest 29 + ts-jest (unit, src/**/*.spec.ts), supertest (e2e, test/), coverage via jest --coverage
  Style: ESLint + Prettier, conventional commits, no AI attribution in commits, README/docs in Spanish

strict_tdd: true

testing:
  strict_tdd: true
  test_command: "npm test"
  unit: "npm test"
  integration: "npm run test:e2e"
  e2e: "npm run test:e2e"
  coverage: "npm run test:cov"
  coverage_threshold: 0

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
