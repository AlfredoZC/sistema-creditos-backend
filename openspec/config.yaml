schema: spec-driven

context: |
  Tech stack: NestJS 10 (Express platform), TypeScript 5.1, TypeORM 0.3 + PostgreSQL, JWT auth (passport-jwt, @nestjs/jwt, bcrypt), class-validator/class-transformer, Swagger at /api, Cloudinary uploads, decimal.js for money math
  Architecture: feature modules (auth single-role, profile, seed, cloudinary, common, patients, doctors, surgery-catalog, surgeries, payment-plans, payment-methods, payments, audit) with module/controller/service, entities/, dto/ (class-validator + barrel index.ts), strategies/validators/transformers/enums under feature dirs, TypeORM migrations in src/database/ with data-source.ts
  Testing: Jest 29 + ts-jest (unit, src/**/*.spec.ts), deterministic integration suite via npm run test:integration (jest --runInBand), supertest (e2e, test/jest-e2e.json), coverage via npm run test:cov
  Migrations: typeorm-ts-node-commonjs -d src/database/data-source.ts (create/generate/run/revert/show)
  Style: ESLint + Prettier, conventional commits, no AI attribution in commits, README/docs in Spanish

strict_tdd: true

testing:
  strict_tdd: true
  test_command: "npm test"
  unit: "npm test"
  integration: "npm run test:integration"
  e2e: "npm run test:e2e"
  coverage: "npm run test:cov"
  coverage_threshold: 0

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
