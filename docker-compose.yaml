services:
  db:
    image: postgres:18-alpine
    restart: always
    container_name: postgres_plat_creditos
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # El volumen cubre PGDATA completo. En postgres:18-alpine el default es
      # PGDATA=/var/lib/postgresql/18/docker; montar el padre (/var/lib/postgresql)
      # permite que un upgrade de major encuentre los datos versionados.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: plataforma-creditos_pgdata
    external: true
